name: Build and release plugin

# Fires on a version tag push, e.g.:
#   git tag 2.0.5 && git push origin 2.0.5
#
# Builds the CSS/JS assets, zips the plugin (compiled assets included,
# dev-only files stripped out) and attaches the zip to a GitHub Release
# for that tag, then republishes the Composer repository (packages.json) on
# GitHub Pages so consumers can require any released version.
#
# Run manually (workflow_dispatch) to only rebuild packages.json, e.g. after
# deleting a release or re-uploading a zip.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build assets
        run: npm run build

      - name: Verify built asset handles
        run: npm run verify:assets

      - name: Check plugin version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME}"
          PLUGIN_VERSION=$(grep -m1 -oP 'Version:\s*\K[0-9.]+' website-builder-blocks.php)
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match the Version header in website-builder-blocks.php ($PLUGIN_VERSION)." >&2
            exit 1
          fi

      - name: Assemble release package
        run: |
          PKG_DIR="dist/website-builder-blocks"
          mkdir -p "$PKG_DIR"
          cp -R build assets languages src "$PKG_DIR/"
          cp website-builder-blocks.php composer.json README.md "$PKG_DIR/"
          (cd dist && zip -r "../website-builder-blocks-${GITHUB_REF_NAME}.zip" website-builder-blocks)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: website-builder-blocks-${{ github.ref_name }}.zip
          generate_release_notes: true

  composer-repo:
    needs: release
    # Still run when release is skipped (manual dispatch), but not if it failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}packages.json
    steps:
      # Rebuilt from scratch on every release: one entry per release that has
      # a plugin zip attached, so there is no state to keep in sync.
      - name: Generate packages.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft | not) | . as $r
                  | .assets[] | select(.name == "website-builder-blocks-\($r.tag_name).zip")
                  | {version: $r.tag_name, url: .browser_download_url}' \
          | jq -s '{packages: {"ministryofjustice/website-builder-blocks":
              (map({key: .version, value: {
                name: "ministryofjustice/website-builder-blocks",
                version: .version,
                type: "wordpress-plugin",
                dist: {url: .url, type: "zip"}
              }}) | from_entries)}}' > site/packages.json
          cat site/packages.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
